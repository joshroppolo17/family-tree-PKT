<!doctype html>
<html>
<head>
  <title>Phi Kappa Tau</title>
  <link rel="icon" type="image/ico" href="favicon.ico"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <!-- Libraries -->
  <script src="lib/didYouMean-1.2.1.min.js"></script>
  <script src="lib/vis.min.js"></script>
  <script src="lib/tinycolor.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js"></script>

  <!-- Your scripts -->
  <script src="relations.js"></script>
  <script src="main.js"></script>

  <!-- Styles -->
  <link href="lib/vis.min.css" rel="stylesheet"/>
  <link href="css/main.css" rel="stylesheet"/>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f4f4; /* light page background */
    }

    h1 {
      text-align: center;
    }

    #color-coding-box {
      background-color: #fff3b0;
      padding: 10px 15px;
      border: 2px solid #f1c40f;
      border-radius: 8px;
      display: inline-block;
      margin-bottom: 20px;
      font-size: 16px;
      color: #c0392b; /* red font for label */
    }

    #color-coding-box label {
      margin-right: 10px;
      font-weight: bold;
    }

    #color-coding-box select {
      padding: 5px 8px;
      font-size: 16px;
      border-radius: 5px;
    }

    #search-container {
      margin-bottom: 20px;
    }

    #search-container input {
      padding: 5px;
      font-size: 16px;
    }

    #search-container button {
      padding: 5px 10px;
      font-size: 16px;
      margin-left: 5px;
    }

    .stretchy-wrapper {
      width: 100%;
      height: 600px; /* adjust height as needed */
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: transparent; /* white-ish box */
      padding: 10px;
      box-sizing: border-box;
    }

    #network-container {
      width: 100%;
      height: 100%;
    }

    #mynetwork {
      width: 100%;
      height: 100%;
    }

    #selection {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>Phi Kappa Tau</h1>

  <div id="color-coding-box">
    <label for="layout">Color Coding:</label>
    <select id="layout">
      <option value="family">Family</option>
      <option value="pledgeClass">Pledge Class</option>
      <option value="active">Active / Inactive</option>
    </select>
  </div>

  <div id="search-container">
    <input type="text" id="searchbox" placeholder="Brother's name...">
    <button id="searchbutton">Search</button>
    <button id="prevsearch" style="display: none"><i class="arrow up"></i></button>
    <button id="nextsearch" style="display: none"><i class="arrow down"></i></button>
  </div>

  <div class="stretchy-wrapper">
    <div id="network-container">
      <div id="mynetwork"></div>
    </div>
  </div>

  <p id="selection"></p>
</body>
</html>
